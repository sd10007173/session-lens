<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Lens</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 24px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  .stats { display: flex; gap: 16px; margin-bottom: 16px; font-size: 13px; color: #666; }
  .stats span { background: #fff; padding: 6px 12px; border-radius: 6px; border: 1px solid #e0e0e0; }
  .stats strong { color: #1a1a1a; }

  .filters { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .filters label { font-size: 13px; color: #666; }
  .filters input, .filters select { font-size: 13px; padding: 6px 10px; border: 1px solid #d0d0d0; border-radius: 6px; background: #fff; outline: none; }
  .filters input:focus, .filters select:focus { border-color: #4a90d9; }
  .filters input[type="date"] { width: 140px; }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .btn-reset { font-size: 12px; padding: 6px 12px; border: 1px solid #d0d0d0; border-radius: 6px; background: #fff; cursor: pointer; color: #666; }
  .btn-reset:hover { background: #f0f0f0; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0; }
  thead th { text-align: left; padding: 10px 14px; font-size: 12px; font-weight: 600; color: #666; background: #fafafa; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
  tbody tr { cursor: pointer; transition: background 0.1s; }
  tbody tr:hover { background: #f7f9fc; }
  tbody tr.expanded { background: #f0f4fa; }
  tbody td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .badge-套利 { background: #fef3e0; color: #e67e00; }
  .badge-CoinKarma { background: #e8f0fe; color: #1a73e8; }
  .badge-夕煇 { background: #f3e8fe; color: #7c3aed; }
  .badge-其他 { background: #f0f0f0; color: #666; }

  .first-msg { max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .date-col { white-space: nowrap; color: #666; }
  .num-col { text-align: right; color: #888; font-variant-numeric: tabular-nums; }

  .detail-row td { padding: 0 !important; border-bottom: 1px solid #e0e0e0 !important; }
  .detail-content { padding: 16px 20px; background: #fafbfc; max-height: 500px; overflow-y: auto; }
  .detail-content .turn { margin-bottom: 12px; }
  .detail-content .turn:last-child { margin-bottom: 0; }
  .detail-content .turn-user { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 14px; }
  .detail-content .turn-assistant { background: #f0f4fa; border: 1px solid #d8e2f0; border-radius: 8px; padding: 10px 14px; }
  .detail-content .turn-label { font-size: 11px; font-weight: 600; color: #888; margin-bottom: 4px; text-transform: uppercase; }
  .detail-content .turn-text { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .detail-content .resume-hint { margin-top: 12px; font-size: 12px; color: #888; }
  .detail-content code { background: #e8e8e8; padding: 2px 6px; border-radius: 3px; font-size: 12px; font-family: "SF Mono", Menlo, monospace; }

  .empty { text-align: center; padding: 40px; color: #999; font-size: 14px; }
  .session-id { font-size: 11px; color: #aaa; font-family: "SF Mono", Menlo, monospace; }
</style>
</head>
<body>

<h1>Session Lens</h1>

<div class="stats" id="stats"></div>

<div class="filters">
  <div class="filter-group">
    <label>從</label>
    <input type="date" id="dateFrom">
  </div>
  <div class="filter-group">
    <label>到</label>
    <input type="date" id="dateTo">
  </div>
  <div class="filter-group">
    <label>分類</label>
    <select id="categoryFilter">
      <option value="">全部</option>
      <option value="套利">套利</option>
      <option value="CoinKarma">CoinKarma</option>
      <option value="夕煇">夕煇</option>
      <option value="其他">其他</option>
    </select>
  </div>
  <div class="filter-group">
    <label>專案</label>
    <select id="projectFilter">
      <option value="">全部</option>
    </select>
  </div>
  <div class="filter-group">
    <input type="text" id="searchInput" placeholder="搜尋訊息內容..." style="width:200px">
  </div>
  <button class="btn-reset" onclick="resetFilters()">重設</button>
</div>

<table>
  <thead>
    <tr>
      <th>日期</th>
      <th>專案</th>
      <th>分類</th>
      <th>第一條訊息</th>
      <th style="text-align:right">訊息數</th>
      <th style="text-align:right">大小</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
const CATEGORY_LABELS = { '套利': '套利', 'CoinKarma': 'CoinKarma', '夕煇': '夕煇', '其他': '其他' };
const CATEGORY_CLASSES = { '套利': 'badge-套利', 'CoinKarma': 'badge-CoinKarma', '夕煇': 'badge-夕煇', '其他': 'badge-其他' };

// --- Mock data (will be replaced by index.json) ---
const MOCK_DATA = [
  { session_id: "6fe9aea5-a9e3-4c27-a7a8-55964102b5b4", project: "CoinKarma/service", category: "work", started_at: "2026-04-25 14:30", last_active: "2026-04-25 16:20", first_message: "BEN-1053 幫我看一下這張單，我們要想辦法來開發。請你先嘗試用 300 字的內容解讀一下這張單的需求是什麼", message_count: 24, filtered_size_kb: 48 },
  { session_id: "365d0042-6fce-4253-adc3-2cff4bf6520f", project: "Arbitrage01/7", category: "arbitrage", started_at: "2026-04-25 10:15", last_active: "2026-04-25 13:45", first_message: "幫我檢查一下目前套利機器人的狀態，看看有沒有卡住的訂單", message_count: 67, filtered_size_kb: 120 },
  { session_id: "f26c8485-e718-4002-bafa-5c234536e544", project: "arbitrage-auto-transfer", category: "arbitrage", started_at: "2026-04-25 09:00", last_active: "2026-04-25 11:30", first_message: "USDT 自動轉帳的邏輯需要修改，現在跨所轉帳有時候會失敗", message_count: 45, filtered_size_kb: 85 },
  { session_id: "8a7933f5-000d-4c7c-b4c6-5c2620e4267b", project: "xihue/manage", category: "work", started_at: "2026-04-24 16:00", last_active: "2026-04-24 18:30", first_message: "後台管理系統的報表頁面需要加一個新的篩選條件", message_count: 31, filtered_size_kb: 55 },
  { session_id: "ab9e0df6-2d24-4ea6-8fd1-56b7e492f0ba", project: "xihue/lotto-service", category: "work", started_at: "2026-04-24 14:00", last_active: "2026-04-24 15:45", first_message: "開獎結果同步的 cron job 有時候會漏掉，幫我查一下原因", message_count: 28, filtered_size_kb: 42 },
  { session_id: "982ce12a-368a-4898-bca5-8e9dd2834de6", project: "personal/health", category: "life", started_at: "2026-04-24 09:00", last_active: "2026-04-24 09:30", first_message: "幫我整理一下最近的健康檢查報告，標出需要注意的數值", message_count: 8, filtered_size_kb: 12 },
  { session_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890", project: "llm-wiki", category: "life", started_at: "2026-04-23 20:00", last_active: "2026-04-23 21:15", first_message: "幫我更新 wiki 裡面關於套利專案的頁面，加上最近的進展", message_count: 15, filtered_size_kb: 22 },
  { session_id: "b2c3d4e5-f6a7-8901-bcde-f12345678901", project: "Arbitrage01/7", category: "arbitrage", started_at: "2026-04-23 15:30", last_active: "2026-04-23 18:00", first_message: "新的交易所 API 接進來了，需要測試一下價差計算邏輯", message_count: 52, filtered_size_kb: 95 },
  { session_id: "c3d4e5f6-a7b8-9012-cdef-123456789012", project: "CoinKarma/service", category: "work", started_at: "2026-04-23 10:00", last_active: "2026-04-23 12:30", first_message: "用戶回報 K 線圖載入很慢，幫我看一下效能問題在哪", message_count: 35, filtered_size_kb: 60 },
  { session_id: "d4e5f6a7-b8c9-0123-defa-234567890123", project: "Arbitrage01/7", category: "arbitrage", started_at: "2026-04-22 14:00", last_active: "2026-04-22 17:30", first_message: "風控模組的止損邏輯需要調整，目前的閾值太敏感了", message_count: 41, filtered_size_kb: 78 },
  { session_id: "e5f6a7b8-c9d0-1234-efab-345678901234", project: "xihue/service", category: "work", started_at: "2026-04-22 09:30", last_active: "2026-04-22 11:00", first_message: "API 的 rate limiting 要改成 per-user 而不是 global", message_count: 19, filtered_size_kb: 30 },
  { session_id: "f6a7b8c9-d0e1-2345-fabc-456789012345", project: "home", category: "life", started_at: "2026-04-21 21:00", last_active: "2026-04-21 22:00", first_message: "幫我規劃一下下週的行程，週三有牙醫、週五有聚餐", message_count: 6, filtered_size_kb: 8 },
];

const MOCK_DETAILS = {
  "6fe9aea5-a9e3-4c27-a7a8-55964102b5b4": [
    { role: "user", text: "BEN-1053 幫我看一下這張單，我們要想辦法來開發。\n\n請你先嘗試：\n1. 用 300 字的內容解讀一下這張單的需求是什麼\n2. 再用 300 字的內容解釋一下這張單要怎麼執行" },
    { role: "assistant", text: "這張單要做的是在 CoinKarma 的幣種詳情頁加上「社群聲量指標」。目前詳情頁只有價格和基本面資料，產品希望加上 Twitter/Reddit 的提及次數趨勢圖，讓用戶能看到社群熱度的變化。\n\n資料來源是現有的 social-metrics 微服務，已經在每小時抓取數據了，但還沒有前端呈現。\n\n執行上建議分兩步：先加 API endpoint 把 social-metrics 的資料暴露出來，再在前端幣種詳情頁加一個新的 tab 放趨勢圖。" },
    { role: "user", text: "好，那我們先做 API 的部分" },
    { role: "assistant", text: "在 `routes/coin.py` 加了 `/api/v1/coins/{coin_id}/social-metrics` endpoint，支援 `period` 參數（7d/30d/90d），回傳每小時的 Twitter 提及數和 Reddit 貼文數。\n\n已經寫好測試，跑過了。" },
  ],
  "365d0042-6fce-4253-adc3-2cff4bf6520f": [
    { role: "user", text: "幫我檢查一下目前套利機器人的狀態，看看有沒有卡住的訂單" },
    { role: "assistant", text: "檢查了所有活躍的交易對，發現 BTC/USDT 在 Exchange A → Exchange B 的方向有一筆訂單卡了 47 分鐘，原因是 Exchange B 的提幣 API 回傳 timeout 但沒有正確重試。\n\n另外 ETH/USDT 的價差在過去一小時內持續為負，建議暫時關閉這個方向。" },
    { role: "user", text: "那個卡住的訂單幫我手動處理掉，然後修一下重試邏輯" },
    { role: "assistant", text: "已處理：\n1. 手動取消了卡住的 BTC/USDT 訂單\n2. 在提幣邏輯加了指數退避重試（最多 3 次，間隔 5s/15s/45s）\n3. 超過 3 次重試就標記為 failed 並發通知" },
  ]
};

// --- App state ---
let sessions = [];
let expandedId = null;

async function loadData() {
  try {
    const resp = await fetch('./index.json');
    if (resp.ok) {
      sessions = await resp.json();
    } else {
      sessions = MOCK_DATA;
    }
  } catch {
    sessions = MOCK_DATA;
  }
  populateProjectFilter();
  render();
}

function populateProjectFilter() {
  const projects = [...new Set(sessions.map(s => s.project))].sort();
  const sel = document.getElementById('projectFilter');
  sel.innerHTML = '<option value="">全部</option>';
  projects.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    sel.appendChild(opt);
  });
}

function getFilters() {
  return {
    dateFrom: document.getElementById('dateFrom').value,
    dateTo: document.getElementById('dateTo').value,
    category: document.getElementById('categoryFilter').value,
    project: document.getElementById('projectFilter').value,
    search: document.getElementById('searchInput').value.toLowerCase(),
  };
}

function filterSessions() {
  const f = getFilters();
  return sessions.filter(s => {
    const d = s.started_at.slice(0, 10);
    if (f.dateFrom && d < f.dateFrom) return false;
    if (f.dateTo && d > f.dateTo) return false;
    if (f.category && s.category !== f.category) return false;
    if (f.project && s.project !== f.project) return false;
    if (f.search && !s.first_message.toLowerCase().includes(f.search)) return false;
    return true;
  });
}

function render() {
  const filtered = filterSessions();
  const tbody = document.getElementById('tbody');

  // Stats
  const statsEl = document.getElementById('stats');
  const totalKb = filtered.reduce((a, s) => a + s.filtered_size_kb, 0);
  statsEl.innerHTML = `
    <span>顯示 <strong>${filtered.length}</strong> / ${sessions.length} 個 session</span>
    <span>過濾後總大小 <strong>${totalKb >= 1024 ? (totalKb/1024).toFixed(1) + ' MB' : totalKb + ' KB'}</strong></span>
  `;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">沒有符合條件的 session</td></tr>';
    return;
  }

  let html = '';
  filtered.forEach(s => {
    const isExpanded = expandedId === s.session_id;
    html += `<tr class="${isExpanded ? 'expanded' : ''}" onclick="toggleDetail('${s.session_id}')">
      <td class="date-col">${s.started_at.slice(0, 16)}</td>
      <td>${s.project}</td>
      <td><span class="badge ${CATEGORY_CLASSES[s.category] || ''}">${CATEGORY_LABELS[s.category] || s.category}</span></td>
      <td class="first-msg" title="${escHtml(s.first_message)}">${escHtml(s.first_message)}</td>
      <td class="num-col">${s.message_count}</td>
      <td class="num-col">${s.filtered_size_kb} KB</td>
    </tr>`;
    if (isExpanded) {
      html += `<tr class="detail-row"><td colspan="6"><div class="detail-content" id="detail-${s.session_id}">載入中...</div></td></tr>`;
    }
  });
  tbody.innerHTML = html;

  if (expandedId) loadDetail(expandedId);
}

async function toggleDetail(id) {
  expandedId = expandedId === id ? null : id;
  render();
}

async function loadDetail(id) {
  const container = document.getElementById('detail-' + id);
  if (!container) return;

  let turns = null;

  // Try loading from file first
  try {
    const resp = await fetch(`./sessions/${id}.json`);
    if (resp.ok) turns = await resp.json();
  } catch {}

  // Fallback to mock
  if (!turns) turns = MOCK_DETAILS[id] || null;

  if (!turns) {
    container.innerHTML = '<div style="color:#999;font-size:13px">尚未產生過濾資料。請先執行 Python 腳本。</div>';
    return;
  }

  let html = turns.map(t => `
    <div class="turn">
      <div class="turn-label">${t.role === 'user' ? '👤 我' : '🤖 Claude'}</div>
      <div class="${t.role === 'user' ? 'turn-user' : 'turn-assistant'}">
        <div class="turn-text">${escHtml(t.text)}</div>
      </div>
    </div>
  `).join('');

  html += `<div class="resume-hint">Resume 指令：<code>claude --resume ${id}</code></div>`;
  container.innerHTML = html;
}

function resetFilters() {
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  document.getElementById('categoryFilter').value = '';
  document.getElementById('projectFilter').value = '';
  document.getElementById('searchInput').value = '';
  render();
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Event listeners
['dateFrom', 'dateTo', 'categoryFilter', 'projectFilter'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});
document.getElementById('searchInput').addEventListener('input', render);

// Set default date range (last 7 days)
const today = new Date();
const weekAgo = new Date(today);
weekAgo.setDate(weekAgo.getDate() - 7);
document.getElementById('dateTo').value = today.toISOString().slice(0, 10);
document.getElementById('dateFrom').value = weekAgo.toISOString().slice(0, 10);

loadData();
</script>
</body>
</html>
