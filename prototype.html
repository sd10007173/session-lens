<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Lens</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='28' cy='28' r='13' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cline x1='38' y1='38' x2='50' y2='50' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3Cline x1='23' y1='25' x2='33' y2='25' stroke='%23fff' stroke-width='3' stroke-linecap='round' opacity='.9'/%3E%3Cline x1='23' y1='32' x2='29' y2='32' stroke='%23fff' stroke-width='3' stroke-linecap='round' opacity='.9'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  .stats { display: flex; gap: 16px; margin-bottom: 16px; font-size: 13px; color: #666; }
  .stats span { background: #fff; padding: 6px 12px; border-radius: 6px; border: 1px solid #e0e0e0; }
  .stats strong { color: #1a1a1a; }

  .filters { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .filters label { font-size: 13px; color: #666; }
  .filters input, .filters select { font-size: 13px; padding: 6px 10px; border: 1px solid #d0d0d0; border-radius: 6px; background: #fff; outline: none; }
  .filters input:focus, .filters select:focus { border-color: #4a90d9; }
  .filters input[type="date"] { width: 140px; }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  .btn-reset { font-size: 12px; padding: 6px 12px; border: 1px solid #d0d0d0; border-radius: 6px; background: #fff; cursor: pointer; color: #666; }
  .btn-reset:hover { background: #f0f0f0; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0; }
  thead th { text-align: left; padding: 10px 14px; font-size: 12px; font-weight: 600; color: #666; background: #fafafa; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { background: #f0f0f0; }
  .sort-arrow { display: inline-block; width: 8px; height: 14px; margin-left: 5px; position: relative; vertical-align: -3px; }
  .sort-arrow::before, .sort-arrow::after { content: ''; position: absolute; left: 0; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
  .sort-arrow::before { top: 1px; border-bottom: 4px solid #ccc; }
  .sort-arrow::after { bottom: 1px; border-top: 4px solid #ccc; }
  .sort-arrow.asc::before { border-bottom-color: #1a73e8; }
  .sort-arrow.desc::after { border-top-color: #1a73e8; }
  tbody tr { cursor: pointer; transition: background 0.1s; }
  tbody tr:hover { background: #f7f9fc; }
  tbody tr.expanded { background: #f0f4fa; }
  tbody td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge-c0 { background: #e8f0fe; color: #1a73e8; }
  .badge-c1 { background: #fef3e0; color: #e67e00; }
  .badge-c2 { background: #e6f4ea; color: #1e8e3e; }
  .badge-c3 { background: #f3e8fd; color: #8b3eba; }
  .badge-c4 { background: #fde8f0; color: #c4366f; }
  .badge-c5 { background: #e0f3f7; color: #00789c; }
  .badge-default { background: #f0f0f0; color: #666; }

  .first-msg { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .last-msg { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #555; }
  .date-col { white-space: nowrap; color: #666; }
  .num-col { text-align: right; color: #888; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .detail-row td { padding: 0 !important; border-bottom: 1px solid #e0e0e0 !important; }
  .detail-content { padding: 16px 20px; background: #fafbfc; max-height: 500px; overflow-y: auto; }
  .detail-content .turn { margin-bottom: 12px; }
  .detail-content .turn:last-child { margin-bottom: 0; }
  .detail-content .turn-user { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 14px; }
  .detail-content .turn-assistant { background: #f0f4fa; border: 1px solid #d8e2f0; border-radius: 8px; padding: 10px 14px; }
  .detail-content .turn-label { font-size: 11px; font-weight: 600; color: #888; margin-bottom: 4px; text-transform: uppercase; }
  .detail-content .turn-text { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .detail-content .resume-hint { margin-top: 12px; font-size: 12px; color: #888; }
  .detail-content code { background: #e8e8e8; padding: 2px 6px; border-radius: 3px; font-size: 12px; font-family: "SF Mono", Menlo, monospace; }
  .turn-images { margin-top: 8px; }
  .show-imgs-btn { font-size: 12px; padding: 4px 10px; border: 1px solid #d0d0d0; border-radius: 6px; background: #fff; cursor: pointer; color: #444; }
  .show-imgs-btn:hover { background: #f0f0f0; }
  .turn-img { max-width: 100%; max-height: 400px; border-radius: 6px; margin-top: 8px; display: block; border: 1px solid #e0e0e0; cursor: zoom-in; }
  .lightbox-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox-overlay img { max-width: 95vw; max-height: 95vh; object-fit: contain; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }

  .empty { text-align: center; padding: 40px; color: #999; font-size: 14px; }
  .session-id { font-size: 11px; color: #aaa; font-family: "SF Mono", Menlo, monospace; white-space: nowrap; }
  .id-col { font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: #888; white-space: nowrap; user-select: text; cursor: text; }
</style>
</head>
<body>

<h1>Session Lens</h1>

<div class="stats" id="stats"></div>

<div class="filters">
  <div class="filter-group">
    <label>從</label>
    <input type="date" id="dateFrom">
  </div>
  <div class="filter-group">
    <label>到</label>
    <input type="date" id="dateTo">
  </div>
  <div class="filter-group">
    <label>分類</label>
    <select id="categoryFilter">
      <option value="">全部</option>
    </select>
  </div>
  <div class="filter-group">
    <label>專案</label>
    <select id="projectFilter">
      <option value="">全部</option>
    </select>
  </div>
  <div class="filter-group">
    <input type="text" id="searchInput" placeholder="搜尋訊息內容..." style="width:200px">
  </div>
  <button class="btn-reset" onclick="resetFilters()">重設</button>
  <button class="btn-reset" id="rescanBtn" onclick="rescan()">重新掃描</button>
  <span id="rescanStatus" style="font-size:12px;color:#888"></span>
</div>

<table>
  <thead>
    <tr>
      <th class="sortable" onclick="setSort('started_at')">開始<span class="sort-arrow" id="arrow-started_at"></span></th>
      <th class="sortable" onclick="setSort('last_active')">最後活動<span class="sort-arrow" id="arrow-last_active"></span></th>
      <th>專案</th>
      <th>分類</th>
      <th>來源</th>
      <th>第一個提示詞</th>
      <th>最後一個提示詞</th>
      <th style="text-align:right">訊息數</th>
      <th style="text-align:right">大小</th>
      <th>Session ID</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
const BADGE_PALETTE = ['badge-c0', 'badge-c1', 'badge-c2', 'badge-c3', 'badge-c4', 'badge-c5'];
const DEFAULT_CATEGORY_NAMES = new Set(['其他', '其它', 'Other', 'Others']);
function categoryClass(cat) {
  if (!cat || DEFAULT_CATEGORY_NAMES.has(cat)) return 'badge-default';
  let h = 0;
  for (let i = 0; i < cat.length; i++) h = (h * 31 + cat.charCodeAt(i)) | 0;
  return BADGE_PALETTE[Math.abs(h) % BADGE_PALETTE.length];
}

// --- Mock data (will be replaced by index.json) ---
const MOCK_DATA = [
  { session_id: "a1b2c3d4-0001-4000-a000-000000000001", project: "acme-app/backend", category: "Work", started_at: "2026-04-25 14:30", last_active: "2026-04-25 16:20", first_message: "Help me add pagination to the /api/users endpoint", message_count: 24, filtered_size_kb: 48 },
  { session_id: "a1b2c3d4-0002-4000-a000-000000000002", project: "acme-app/frontend", category: "Work", started_at: "2026-04-25 10:15", last_active: "2026-04-25 13:45", first_message: "The dashboard chart is rendering slowly, let's optimize it", message_count: 35, filtered_size_kb: 60 },
  { session_id: "a1b2c3d4-0003-4000-a000-000000000003", project: "my-side-project", category: "Side Project", started_at: "2026-04-25 09:00", last_active: "2026-04-25 11:30", first_message: "Add dark mode support to the landing page", message_count: 45, filtered_size_kb: 85 },
  { session_id: "a1b2c3d4-0004-4000-a000-000000000004", project: "acme-app/backend", category: "Work", started_at: "2026-04-24 16:00", last_active: "2026-04-24 18:30", first_message: "The cron job for daily reports sometimes misses entries", message_count: 31, filtered_size_kb: 55 },
  { session_id: "a1b2c3d4-0005-4000-a000-000000000005", project: "rust-tutorial", category: "Learning", started_at: "2026-04-24 14:00", last_active: "2026-04-24 15:45", first_message: "Explain ownership and borrowing in Rust with examples", message_count: 28, filtered_size_kb: 42 },
  { session_id: "a1b2c3d4-0006-4000-a000-000000000006", project: "home", category: "Other", started_at: "2026-04-24 09:00", last_active: "2026-04-24 09:30", first_message: "Help me write a meal plan for next week", message_count: 8, filtered_size_kb: 12 },
  { session_id: "a1b2c3d4-0007-4000-a000-000000000007", project: "my-side-project", category: "Side Project", started_at: "2026-04-23 20:00", last_active: "2026-04-23 21:15", first_message: "Set up CI/CD pipeline with GitHub Actions", message_count: 15, filtered_size_kb: 22 },
  { session_id: "a1b2c3d4-0008-4000-a000-000000000008", project: "acme-app/backend", category: "Work", started_at: "2026-04-23 10:00", last_active: "2026-04-23 12:30", first_message: "Refactor the auth middleware to support OAuth2", message_count: 52, filtered_size_kb: 95 },
  { session_id: "a1b2c3d4-0009-4000-a000-000000000009", project: "ml-course", category: "Learning", started_at: "2026-04-22 14:00", last_active: "2026-04-22 17:30", first_message: "Walk me through building a simple neural network from scratch", message_count: 41, filtered_size_kb: 78 },
  { session_id: "a1b2c3d4-0010-4000-a000-000000000010", project: "home", category: "Other", started_at: "2026-04-21 21:00", last_active: "2026-04-21 22:00", first_message: "Help me draft an email to my landlord about the lease renewal", message_count: 6, filtered_size_kb: 8 },
];

const MOCK_DETAILS = {
  "a1b2c3d4-0001-4000-a000-000000000001": [
    { role: "user", text: "Help me add pagination to the /api/users endpoint" },
    { role: "assistant", text: "Added offset/limit pagination to the /api/users endpoint. The default page size is 20, max 100.\n\nAlso added Link headers for next/prev pages following RFC 5988." },
    { role: "user", text: "Can you also add cursor-based pagination as an alternative?" },
    { role: "assistant", text: "Done. The endpoint now supports both modes:\n- `?offset=20&limit=10` for offset pagination\n- `?cursor=abc123&limit=10` for cursor pagination\n\nCursor is based on the user's created_at timestamp + id for stable ordering." },
  ],
  "a1b2c3d4-0003-4000-a000-000000000003": [
    { role: "user", text: "Add dark mode support to the landing page" },
    { role: "assistant", text: "Added dark mode with CSS custom properties. It respects the user's system preference via `prefers-color-scheme` and also has a manual toggle button in the header.\n\nColors are defined in :root and [data-theme='dark'] selectors." },
    { role: "user", text: "The toggle button needs to persist the user's choice" },
    { role: "assistant", text: "Updated the toggle to save the preference in localStorage. On page load it checks:\n1. localStorage value first\n2. Falls back to system preference\n\nThe button icon switches between sun/moon accordingly." },
  ]
};

// --- App state ---
let sessions = [];
let expandedId = null;
let sortKey = 'started_at';
let sortDir = 'desc';

function setSort(key) {
  if (sortKey === key) {
    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  } else {
    sortKey = key;
    sortDir = 'desc';
  }
  render();
}

async function loadData() {
  try {
    const resp = await fetch('./index.json');
    if (resp.ok) {
      sessions = await resp.json();
    } else {
      sessions = MOCK_DATA;
    }
  } catch {
    sessions = MOCK_DATA;
  }
  populateCategoryFilter();
  populateProjectFilter();
  render();
}

function populateCategoryFilter() {
  const cats = [...new Set(sessions.map(s => s.category))].sort();
  const sel = document.getElementById('categoryFilter');
  sel.innerHTML = '<option value="">全部</option>';
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
}

function populateProjectFilter() {
  const projects = [...new Set(sessions.map(s => s.project))].sort();
  const sel = document.getElementById('projectFilter');
  sel.innerHTML = '<option value="">全部</option>';
  projects.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    sel.appendChild(opt);
  });
}

function getFilters() {
  return {
    dateFrom: document.getElementById('dateFrom').value,
    dateTo: document.getElementById('dateTo').value,
    category: document.getElementById('categoryFilter').value,
    project: document.getElementById('projectFilter').value,
    search: document.getElementById('searchInput').value.toLowerCase(),
  };
}

function filterSessions() {
  const f = getFilters();
  return sessions.filter(s => {
    const d = s.started_at.slice(0, 10);
    if (f.dateFrom && d < f.dateFrom) return false;
    if (f.dateTo && d > f.dateTo) return false;
    if (f.category && s.category !== f.category) return false;
    if (f.project && s.project !== f.project) return false;
    if (f.search) {
      const haystack = (s.first_message + ' ' + (s.last_message || '')).toLowerCase();
      if (!haystack.includes(f.search)) return false;
    }
    return true;
  });
}

function render() {
  const filtered = filterSessions();
  filtered.sort((a, b) => {
    const va = a[sortKey] || '';
    const vb = b[sortKey] || '';
    return sortDir === 'desc' ? vb.localeCompare(va) : va.localeCompare(vb);
  });
  ['started_at', 'last_active'].forEach(k => {
    const el = document.getElementById('arrow-' + k);
    if (!el) return;
    el.classList.remove('asc', 'desc');
    if (k === sortKey) el.classList.add(sortDir);
  });
  const tbody = document.getElementById('tbody');

  // Stats
  const statsEl = document.getElementById('stats');
  const totalKb = filtered.reduce((a, s) => a + s.filtered_size_kb, 0);
  statsEl.innerHTML = `
    <span>顯示 <strong>${filtered.length}</strong> / ${sessions.length} 個 session</span>
    <span>過濾後總大小 <strong>${totalKb >= 1024 ? (totalKb/1024).toFixed(1) + ' MB' : totalKb + ' KB'}</strong></span>
  `;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty">沒有符合條件的 session</td></tr>';
    return;
  }

  let html = '';
  filtered.forEach(s => {
    const isExpanded = expandedId === s.session_id;
    const lastMsg = s.last_message || '';
    const lastActive = (s.last_active || '').slice(0, 16);
    html += `<tr class="${isExpanded ? 'expanded' : ''}" onclick="toggleDetail('${s.session_id}')">
      <td class="date-col">${s.started_at.slice(0, 16)}</td>
      <td class="date-col">${lastActive}</td>
      <td>${s.project}</td>
      <td><span class="badge ${categoryClass(s.category)}">${escHtml(s.category)}</span></td>
      <td>${s.source === 'codex' ? 'Codex' : 'Claude'}</td>
      <td class="first-msg" title="${escHtml(s.first_message)}">${escHtml(s.first_message)}</td>
      <td class="last-msg" title="${escHtml(lastMsg)}">${escHtml(lastMsg)}</td>
      <td class="num-col">${s.message_count}</td>
      <td class="num-col">${s.filtered_size_kb} KB</td>
      <td class="id-col" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()">${escHtml(s.session_id)}</td>
    </tr>`;
    if (isExpanded) {
      html += `<tr class="detail-row"><td colspan="10"><div class="detail-content" id="detail-${s.session_id}">載入中...</div></td></tr>`;
    }
  });
  tbody.innerHTML = html;

  if (expandedId) loadDetail(expandedId);
}

async function toggleDetail(id) {
  expandedId = expandedId === id ? null : id;
  render();
}

async function loadDetail(id) {
  const container = document.getElementById('detail-' + id);
  if (!container) return;

  let turns = null;
  const session = sessions.find(s => s.session_id === id) || {};
  const agentName = session.source === 'codex' ? 'Codex' : 'Claude';

  // Try loading from file first
  try {
    const resp = await fetch(`./sessions/${id}.json`);
    if (resp.ok) turns = await resp.json();
  } catch {}

  // Fallback to mock
  if (!turns) turns = MOCK_DETAILS[id] || null;

  if (!turns) {
    container.innerHTML = '<div style="color:#999;font-size:13px">尚未產生過濾資料。請先執行 Python 腳本。</div>';
    return;
  }

  window.__sessionImages = window.__sessionImages || {};
  let html = turns.map((t, i) => {
    let imgHtml = '';
    if (t.images && t.images.length > 0) {
      const srcs = t.images.map(f => `./sessions/images/${id}/${f}`);
      const key = `imgs-${id}-${i}`;
      window.__sessionImages[key] = srcs;
      imgHtml = `<div class="turn-images" id="${key}">
        <button class="show-imgs-btn" onclick="event.stopPropagation(); revealImages('${key}')">顯示 ${t.images.length} 張圖片</button>
      </div>`;
    }
    return `
      <div class="turn">
        <div class="turn-label">${t.role === 'user' ? '👤 我' : '🤖 ' + agentName}</div>
        <div class="${t.role === 'user' ? 'turn-user' : 'turn-assistant'}">
          <div class="turn-text">${escHtml(t.text)}</div>
          ${imgHtml}
        </div>
      </div>
    `;
  }).join('');

  const resumeCommand = session.source === 'codex'
    ? `codex resume ${id.replace(/^codex-/, '')}`
    : `claude --resume ${id}`;
  html += `<div class="resume-hint">Resume 指令：<code>${resumeCommand}</code></div>`;
  container.innerHTML = html;
}

function revealImages(key) {
  const container = document.getElementById(key);
  if (!container) return;
  const srcs = (window.__sessionImages || {})[key] || [];
  container.innerHTML = srcs.map(s => `<img src="${s}" class="turn-img" alt="" onclick="event.stopPropagation(); openLightbox(this.src)">`).join('');
}

function openLightbox(src) {
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  const img = document.createElement('img');
  img.src = src;
  overlay.appendChild(img);
  const close = () => {
    overlay.remove();
    document.removeEventListener('keydown', escHandler);
  };
  const escHandler = (e) => { if (e.key === 'Escape') close(); };
  overlay.onclick = close;
  document.addEventListener('keydown', escHandler);
  document.body.appendChild(overlay);
}

async function rescan() {
  const btn = document.getElementById('rescanBtn');
  const status = document.getElementById('rescanStatus');
  btn.disabled = true;
  status.textContent = '掃描中…';
  try {
    const resp = await fetch('./api/digest', { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || resp.statusText);
    await loadData();
    status.textContent = `完成，共 ${data.count} 個 session`;
  } catch (e) {
    status.textContent = '失敗：' + e.message;
  } finally {
    btn.disabled = false;
  }
}

function resetFilters() {
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  document.getElementById('categoryFilter').value = '';
  document.getElementById('projectFilter').value = '';
  document.getElementById('searchInput').value = '';
  render();
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Event listeners
['dateFrom', 'dateTo', 'categoryFilter', 'projectFilter'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});
document.getElementById('searchInput').addEventListener('input', render);

// Set default date range (last 7 days)
const today = new Date();
const weekAgo = new Date(today);
weekAgo.setDate(weekAgo.getDate() - 7);
document.getElementById('dateTo').value = today.toISOString().slice(0, 10);
document.getElementById('dateFrom').value = weekAgo.toISOString().slice(0, 10);

loadData();
</script>
</body>
</html>
